name: Apply Round 3 Visual UX

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - 'scripts/apply_round3_visual_ux.py'
      - '.github/workflows/apply-round3-visual-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/uno-platform-ui
          fetch-depth: 0

      - name: Apply reviewed Round 3 source patch
        run: python scripts/apply_round3_visual_ux.py

      - name: Commit patched source and guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Diez.Uno/DiezPublisherShellHost.cs src/Diez.Uno/VisualBookWorkspace.cs docs/GUIDA_DIEZ.md
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Implement Round 3 visual pre-prompt UX'
          git pull --rebase origin spike/uno-platform-ui
          git push origin HEAD:spike/uno-platform-ui
