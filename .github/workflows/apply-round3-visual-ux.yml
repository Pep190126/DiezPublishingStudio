name: Apply Visual UX Migration

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - 'scripts/cleanup_round4_duplicate_using.py'
      - '.github/workflows/apply-round3-visual-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/uno-platform-ui
          fetch-depth: 0

      - name: Clean reviewed Round 4 source
        run: python scripts/cleanup_round4_duplicate_using.py

      - name: Run visual semantic regression gate
        run: dotnet run --project tests/Diez.VisualBook.Pianist/Diez.VisualBook.Pianist.csproj -c Release

      - name: Commit source cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Diez.Core/DiezVisualHardPromptFrontendBridge.cs
          if git diff --cached --quiet; then
            echo 'No source cleanup needed.'
            exit 0
          fi
          git commit -m 'Clean Round 4 semantic prompt compiler source'
          git pull --rebase origin spike/uno-platform-ui
          git push origin HEAD:spike/uno-platform-ui
