name: Apply Visual UX Migration

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - 'scripts/apply_round5_native_image_quality_fix.py'
      - '.github/workflows/apply-round3-visual-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/uno-platform-ui
          fetch-depth: 0

      - name: Apply reviewed Round 5 native-image quality patch
        run: python scripts/apply_round5_native_image_quality_fix.py

      - name: Run visual semantic regression gate
        run: dotnet run --project tests/Diez.VisualBook.Pianist/Diez.VisualBook.Pianist.csproj -c Release

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Diez.Core/DiezVisualHardPromptFrontendBridge.cs \
                  src/Diez.Core/DiezPromptPackBatchFrontendBridge.cs \
                  src/Diez.Core/DiezVisionFrontendBridge.cs
          if git diff --cached --quiet; then
            echo 'No Round 5 source changes to commit.'
            exit 0
          fi
          git commit -m 'Require native image generation and quality-first coloring prompts'
          git pull --rebase origin spike/uno-platform-ui
          git push origin HEAD:spike/uno-platform-ui
