name: Apply Response Status Hotfix

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - '.github/workflows/response-status-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/uno-platform-ui
          fetch-depth: 0

      - name: Apply narrow status compatibility fix and regression assertions
        shell: python
        run: |
          from pathlib import Path

          core = Path('src/Diez.Core/DiezVisualResponsePackFrontendBridge.cs')
          text = core.read_text(encoding='utf-8')
          old = '''        "SUCCEEDED" => "COMPLETE",\n        "FAILED" => "FAILED",\n        "FAIL" => "FAILED",'''
          new = '''        "SUCCEEDED" => "COMPLETE",\n        // Some provider-produced Response packs use Diez's internal lifecycle word CANDIDATE\n        // for a successfully produced result. At the transport boundary it is equivalent to COMPLETE.\n        "CANDIDATE" => "COMPLETE",\n        "INCOMPLETE" => "INCOMPLETE",\n        "FAILED" => "FAILED",\n        "FAIL" => "FAILED",'''
          if old not in text:
              raise SystemExit('Expected NormalizeResultStatus block not found; refusing partial patch')
          text = text.replace(old, new, 1)
          core.write_text(text, encoding='utf-8')

          test = Path('tests/Diez.VisualBook.Pianist/Program.cs')
          t = test.read_text(encoding='utf-8')
          marker = '    Console.WriteLine("VISUAL BOOK PIANIST PASS: three visual families survived canonical setup, atomic prompts, Vision-only approval, explicit promotion, whole-book duplicates, freeze/preflight, publication candidate and final approved-asset export.");'
          injected = '''    var normalizeResultStatus = typeof(DiezVisualResponsePackFrontendBridge).GetMethod(\n        "NormalizeResultStatus", System.Reflection.BindingFlags.NonPublic | System.Reflection.BindingFlags.Static);\n    Require(normalizeResultStatus is not null, "Il normalizzatore degli status Response deve restare disponibile al gate visuale.");\n    Require((string?)normalizeResultStatus!.Invoke(null, new object?[] { "CANDIDATE" }) == "COMPLETE",\n        "Response compatibility: CANDIDATE deve essere accettato come alias transport di COMPLETE.");\n    Require((string?)normalizeResultStatus.Invoke(null, new object?[] { "INCOMPLETE" }) == "INCOMPLETE",\n        "Response protocol: INCOMPLETE deve restare uno status transport valido.");\n    Require((string?)normalizeResultStatus.Invoke(null, new object?[] { "QUALSIASI" }) == string.Empty,\n        "Response safety: uno status sconosciuto deve continuare a essere rifiutato.");\n\n''' + marker
          if marker not in t:
              raise SystemExit('Expected pianist PASS marker not found; refusing partial patch')
          t = t.replace(marker, injected, 1)
          test.write_text(t, encoding='utf-8')

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Diez.Core/DiezVisualResponsePackFrontendBridge.cs tests/Diez.VisualBook.Pianist/Program.cs
          git commit -m 'Accept CANDIDATE Response status as COMPLETE alias'
          git push origin HEAD:spike/uno-platform-ui
