name: Structured Scene Contract

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/Diez.SceneContract/Diez.SceneContract.csproj
      - run: dotnet build tests/Diez.SceneContract/Diez.SceneContract.csproj -c Release --no-restore
      - run: dotnet run --project tests/Diez.SceneContract/Diez.SceneContract.csproj -c Release --no-build
