name: Windows Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj

      - name: Build
        run: dotnet build src/Diez.Desktop/Diez.Desktop.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish src/Diez.Desktop/Diez.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      - name: Smoke launch real GUI startup
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $startupLog = Join-Path $env:LOCALAPPDATA "Diez Publishing Studio\logs\startup-errors.log"
          if (Test-Path $startupLog) { Remove-Item $startupLog -Force }
          $started = Get-Date
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          if ($process.HasExited) {
            Write-Host "Diez exited with code $($process.ExitCode). Diagnostic events since launch:"
            if (Test-Path $startupLog) { Write-Host "--- Diez startup log ---"; Get-Content $startupLog }
            Write-Host "--- .NET Runtime / Application Error events ---"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started.AddSeconds(-2)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('.NET Runtime','Application Error','Windows Error Reporting') } |
              Select-Object -First 12 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List | Out-String -Width 240 | Write-Host
            throw "Diez exited during normal GUI startup with code $($process.ExitCode)"
          }
          if (Test-Path $startupLog) {
            Get-Content $startupLog
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Diez entered startup diagnostic mode; one or more UI modules failed to attach"
          }
          Stop-Process -Id $process.Id -Force

      - name: Rasterize real editable screens
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $probe = Start-Process -FilePath $exe -ArgumentList "--ui-raster-probe" -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            $errorFile = "artifacts\publish\ui-raster-error.txt"
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw "UI raster probe failed with exit code $($probe.ExitCode)"
          }
          foreach ($file in @(
            "artifacts\publish\ui-quantity.png",
            "artifacts\publish\ui-consistent-variation.png",
            "artifacts\publish\ui-consistent-notes.png",
            "artifacts\publish\ui-prompt.png"
          )) {
            if (!(Test-Path $file)) { throw "Missing raster screenshot: $file" }
            $item = Get-Item $file
            if ($item.Length -lt 10000) { throw "Raster screenshot unexpectedly small: $file ($($item.Length) bytes)" }
          }

      - name: Upload raster UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: DiezPublishingStudio-SW-FLOW-12-Raster-Evidence
          path: |
            artifacts/publish/ui-quantity.png
            artifacts/publish/ui-consistent-variation.png
            artifacts/publish/ui-consistent-notes.png
            artifacts/publish/ui-prompt.png
          if-no-files-found: error
          retention-days: 30

      - name: Real GUI contract SW-FLOW-12 prompt compiler and visual books
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $result = Join-Path (Split-Path $exe) "ui-flow-contract.txt"
          $logRoot = Join-Path $env:LOCALAPPDATA "Diez Publishing Studio\logs"
          $started = Get-Date
          if (Test-Path $result) { Remove-Item $result -Force }
          foreach ($name in @("navigation.log", "navigation-errors.log", "fatal-errors.log")) {
            $p = Join-Path $logRoot $name
            if (Test-Path $p) { Remove-Item $p -Force }
          }
          $probe = Start-Process -FilePath $exe -ArgumentList "--ui-flow-contract" -PassThru
          if (-not $probe.WaitForExit(30000)) {
            Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
            throw "UI flow contract timed out"
          }
          if (Test-Path $result) { Get-Content $result }
          if ($probe.ExitCode -ne 0) {
            Write-Host "--- Diez navigation diagnostics ---"
            foreach ($name in @("navigation.log", "navigation-errors.log", "fatal-errors.log")) {
              $p = Join-Path $logRoot $name
              if (Test-Path $p) { Write-Host "--- $name ---"; Get-Content $p }
            }
            Write-Host "--- .NET Runtime / Application Error events ---"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started.AddSeconds(-2)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('.NET Runtime','Application Error','Windows Error Reporting') } |
              Select-Object -First 20 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List | Out-String -Width 260 | Write-Host
            throw "UI flow contract failed with exit code $($probe.ExitCode)"
          }
          if (!(Test-Path $result)) { throw "UI flow contract did not produce a result file" }
          $text = Get-Content $result -Raw
          foreach ($required in @(
            "OK", "SW-FLOW-12", "book-type=visible", "book-type-back=works", "quantity-change-type=absent",
            "quantity-field=native-numeric", "visual-subject-environment=native-visible", "coloring-style=native-visible",
            "coloring-binary-bw=fixed", "line-thickness=dropdown", "image-specs=visible", "kdp-trim-presets=yes",
            "editable-inputs=avaloniaedit-raster", "active-project=kept-until-replace-or-exit", "home-resume=book-type",
            "consistent-on=criteria-native-visible", "consistency-notes=native-visible", "consistency-levels=3",
            "consistency-free-strategies=USER,AI,MIXED", "consistency-free-user=description-required",
            "consistency-free-ai=description-optional", "consistency-free-mixed=description-required",
            "bleed=image-generation-removed", "prompt-editors=native-3", "undo=ctrl-z", "redo=ctrl-y",
            "prompt-semantic-engine=3.0", "prompt-provider-compiler=3.3", "prompt-profile-isolation=yes",
            "prompt-work-unit-output=1", "prompt-render-field=image_generation_prompt", "prompt-context-single-source=yes",
            "visual-context=V3", "response-import=audited-v2", "visual-prompt-pipeline=single-source"
          )) {
            if ($text -notmatch [regex]::Escape($required)) { throw "UI flow contract missing: $required" }
          }

      - name: Self-test prompt compiler isolation import correction and lifecycle
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) {
            $errorFile = "artifacts\publish\self-test-error.txt"
            $detail = "Diez self-test failed with exit code $($test.ExitCode)"
            if (Test-Path $errorFile) {
              $detail = Get-Content $errorFile -Raw
              Write-Host $detail
            }
            $annotation = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Diez self-test::$annotation"
            throw "Diez self-test failed with exit code $($test.ExitCode)"
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build setup EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DiezPublishingStudio.iss

      - name: Verify setup exists
        shell: powershell
        run: |
          $setup = "artifacts\installer\DiezPublishingStudio-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer not generated: $setup" }
          Get-FileHash $setup -Algorithm SHA256

      - name: Smoke test update/remove and work-data retention matrix
        shell: powershell
        run: |
          $setup = (Resolve-Path "artifacts\installer\DiezPublishingStudio-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "DiezPublishingStudio-Smoke"
          $dirArg = "/DIR=`"$installDir`""
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{E6BE35BE-1F4B-4A3D-8CEB-27D970D85911}_is1"
          $localRoot = Join-Path $env:LOCALAPPDATA "Diez Publishing Studio"
          $configDir = Join-Path $localRoot "config"
          $workDir = Join-Path $localRoot "versions"
          $configMarker = Join-Path $configDir "config-marker.txt"
          $workMarker = Join-Path $workDir "work-marker.txt"

          $first = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", $dirArg -Wait -PassThru
          if ($first.ExitCode -ne 0) { throw "First install failed with exit code $($first.ExitCode)" }
          $exe = Join-Path $installDir "DiezPublishingStudio.exe"
          if (!(Test-Path $exe)) { throw "Installed executable missing after first install" }

          New-Item -ItemType Directory -Force $configDir | Out-Null
          New-Item -ItemType Directory -Force $workDir | Out-Null
          Set-Content -Path $configMarker -Value "config"
          Set-Content -Path $workMarker -Value "work"

          $updateKeep = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/KEEPWORKDATA=1", $dirArg -Wait -PassThru
          if ($updateKeep.ExitCode -ne 0) { throw "Update/keep failed with exit code $($updateKeep.ExitCode)" }
          if (!(Test-Path $configMarker)) { throw "Update unexpectedly removed Diez configuration" }
          if (!(Test-Path $workMarker)) { throw "Update unexpectedly removed work/versioning" }

          $removeKeep = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLEANOLD=1", "/KEEPWORKDATA=1", $dirArg -Wait -PassThru
          if ($removeKeep.ExitCode -ne 0) { throw "Remove/reinstall keep-work failed with exit code $($removeKeep.ExitCode)" }
          if (Test-Path $configMarker) { throw "Remove/reinstall kept configuration even though configuration must reset" }
          if (!(Test-Path $workMarker)) { throw "Remove/reinstall deleted work/versioning even though KEEPWORKDATA=1" }
          if (!(Test-Path $exe)) { throw "Installed executable missing after remove/reinstall keep-work" }

          New-Item -ItemType Directory -Force $configDir | Out-Null
          Set-Content -Path $configMarker -Value "config-again"

          $removeDrop = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLEANOLD=1", "/KEEPWORKDATA=0", $dirArg -Wait -PassThru
          if ($removeDrop.ExitCode -ne 0) { throw "Remove/reinstall drop-work failed with exit code $($removeDrop.ExitCode)" }
          if (Test-Path $configMarker) { throw "Configuration marker still exists after remove/reinstall" }
          if (Test-Path $workMarker) { throw "Work/versioning marker still exists with KEEPWORKDATA=0" }
          if (!(Test-Path $exe)) { throw "Installed executable missing after remove/reinstall drop-work" }
          if (!(Test-Path $uninstallKey)) { throw "Uninstall registry entry missing after final reinstall" }

          $uninstallString = (Get-ItemProperty -Path $uninstallKey).UninstallString
          if ([string]::IsNullOrWhiteSpace($uninstallString)) { throw "UninstallString missing" }
          $uninstaller = $uninstallString.Trim('"')
          if (!(Test-Path $uninstaller)) { throw "Registered uninstaller missing: $uninstaller" }

          $remove = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall failed with exit code $($remove.ExitCode)" }
          if (Test-Path $exe) { throw "Executable still present after uninstall" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DiezPublishingStudio-Setup-1.0.0-rc8-SW-FLOW-12-PromptCompiler33-RendererBrief
          path: artifacts/installer/DiezPublishingStudio-Setup.exe
          if-no-files-found: error
          retention-days: 90
