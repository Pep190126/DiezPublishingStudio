name: Uno Platform Spike

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - 'src/Diez.Core/**'
      - 'src/Diez.Desktop/**'
      - 'src/Diez.Uno/**'
      - 'tests/Diez.Core.Pianist/**'
      - 'tests/Diez.LongForm.Pianist/**'
      - 'tests/Diez.Scene.Pianist/**'
      - 'tests/Diez.Crossword.Pianist/**'
      - 'tests/Diez.WordSearch.Pianist/**'
      - 'tests/Diez.PromptCompiler.Pianist/**'
      - 'tests/Diez.Vision.Pianist/**'
      - '.github/workflows/uno-platform-spike.yml'
  workflow_dispatch:

jobs:
  desktop-build:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore shared core
        run: dotnet restore src/Diez.Core/Diez.Core.csproj

      - name: Build shared core
        run: dotnet build src/Diez.Core/Diez.Core.csproj -c Release --no-restore

      - name: Restore legacy Avalonia desktop
        run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj

      - name: Build legacy Avalonia desktop
        run: dotnet build src/Diez.Desktop/Diez.Desktop.csproj -c Release --no-restore

      - name: Run pianist core stress harness
        run: dotnet run --project tests/Diez.Core.Pianist/Diez.Core.Pianist.csproj -c Release

      - name: Run long-form pianist contract
        run: dotnet run --project tests/Diez.LongForm.Pianist/Diez.LongForm.Pianist.csproj -c Release

      - name: Run structured-scene pianist contract
        run: dotnet run --project tests/Diez.Scene.Pianist/Diez.Scene.Pianist.csproj -c Release

      - name: Run Crossword pianist contract
        run: dotnet run --project tests/Diez.Crossword.Pianist/Diez.Crossword.Pianist.csproj -c Release

      - name: Run Word Search pianist contract
        run: dotnet run --project tests/Diez.WordSearch.Pianist/Diez.WordSearch.Pianist.csproj -c Release

      - name: Run Prompt Compiler 3.6 pianist contract
        run: dotnet run --project tests/Diez.PromptCompiler.Pianist/Diez.PromptCompiler.Pianist.csproj -c Release

      - name: Run Vision HARD-gate pianist contract
        run: dotnet run --project tests/Diez.Vision.Pianist/Diez.Vision.Pianist.csproj -c Release

      - name: Restore Uno desktop spike
        run: dotnet restore src/Diez.Uno/Diez.Uno.csproj

      - name: Build Uno desktop spike
        run: dotnet build src/Diez.Uno/Diez.Uno.csproj -c Release -f net10.0-desktop --no-restore

      - name: Publish Windows x64 spike
        if: runner.os == 'Windows'
        run: dotnet publish src/Diez.Uno/Diez.Uno.csproj -c Release -f net10.0-desktop -r win-x64 -p:SelfContained=true -o artifacts/uno-win-x64

      - name: Upload Windows spike
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: diez-uno-spike-win-x64
          path: artifacts/uno-win-x64
          if-no-files-found: error
