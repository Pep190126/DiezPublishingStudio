name: Core Headless Regression

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj
      - run: dotnet build src/Diez.Desktop/Diez.Desktop.csproj -c Release --no-restore
      - run: dotnet publish src/Diez.Desktop/Diez.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      - name: Core self-test
        shell: powershell
        run: |
          $started = Get-Date
          & artifacts\publish\DiezPublishingStudio.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started.AddSeconds(-2)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('.NET Runtime','Application Error','Windows Error Reporting') } |
              Select-Object -First 12 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List | Out-String -Width 260 | Write-Host
            throw "Core self-test failed"
          }

      - name: Upload self-test diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diez-Core-SelfTest-Diagnostic
          path: artifacts/publish/self-test-error.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Headless UI startup
        shell: powershell
        run: |
          & artifacts\publish\DiezPublishingStudio.exe --ui-headless-ci
          if ($LASTEXITCODE -ne 0) { throw "Headless startup failed" }

      - name: Headless UI contract
        shell: powershell
        run: |
          & artifacts\publish\DiezPublishingStudio.exe --ui-headless-ci --ui-flow-contract
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts\publish\ui-flow-contract.txt; throw "UI contract failed" }
          $text = Get-Content artifacts\publish\ui-flow-contract.txt -Raw
          foreach ($required in @(
            "structured-scene-mode=environment-switch",
            "structured-scene-id=stable",
            "structured-scene-membership-ui=listbox",
            "structured-scene-consistent-membership=subject-id",
            "prompt-provider-compiler-current=3.6",
            "prompt-synthesis=creative-director",
            "prompt-scene-participants=hard"
          )) {
            if ($text -notmatch [regex]::Escape($required)) { throw "Missing contract marker: $required" }
          }
