name: Apply Round 5.5 Planner Handoff

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - 'src/Diez.Uno/Round55ApplyMarker.cs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/uno-platform-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Round 5.5 editable proposal patch
        run: python scripts/apply_round55_editable_proposal.py
      - name: Commit Round 5.5 editable proposal source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Diez.Core/DiezVisualSubjectPlannerFrontendBridge.cs \
            src/Diez.Uno/VisualBookDocumentAdapter.cs \
            src/Diez.Uno/VisualBookWorkspace.cs \
            tests/Diez.VisualSemanticRegression/Program.cs
          if git diff --cached --quiet; then
            echo 'No Round 5.5 editable proposal changes to commit.'
          else
            git commit -m 'Round 5.5: make AI subject proposal editable before acceptance'
            git push origin HEAD:spike/uno-platform-ui
          fi
