name: Apply Round 5.5 Planner Handoff

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - 'src/Diez.Uno/Round55ApplyMarker.cs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/uno-platform-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix Round 5.5 compile
        run: python scripts/fix_round55_compile.py
      - name: Commit Round 5.5 compile fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Diez.Core/DiezVisualSubjectPlannerFrontendBridge.cs
          if git diff --cached --quiet; then
            echo 'No Round 5.5 compile changes to commit.'
          else
            git commit -m 'Round 5.5: fix reconciliation prompt schema literal'
            git push origin HEAD:spike/uno-platform-ui
          fi
