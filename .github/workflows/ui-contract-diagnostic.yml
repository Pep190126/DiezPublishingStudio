name: UI Contract Diagnostic

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj
      - run: dotnet build src/Diez.Desktop/Diez.Desktop.csproj -c Release --no-restore
      - run: dotnet publish src/Diez.Desktop/Diez.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      # This MUST traverse Program.Main -> StartWithClassicDesktopLifetime -> App.Initialize ->
      # MainWindow and all normal startup attachments. Do not add --ui-headless-ci here: the
      # headless harness is useful for deterministic UI-tree tests but cannot validate installed-app startup.
      - name: Run real Windows desktop flow contract
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-flow-contract" -Wait -PassThru
          Write-Host "Real desktop flow exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            $resultFile = "artifacts\publish\ui-flow-contract.txt"
            if (Test-Path $resultFile) { Get-Content $resultFile }
            $fatal = Join-Path $env:LOCALAPPDATA "Diez Publishing Studio\logs\fatal-errors.log"
            $startup = Join-Path $env:LOCALAPPDATA "Diez Publishing Studio\logs\startup-errors.log"
            if (Test-Path $fatal) { Write-Host "--- fatal-errors.log ---"; Get-Content $fatal }
            if (Test-Path $startup) { Write-Host "--- startup-errors.log ---"; Get-Content $startup }
            throw "Real desktop flow failed with exit code $($process.ExitCode)"
          }

      - name: Upload UI flow diagnostic when produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diez-UI-Flow-Diagnostic
          path: artifacts/publish/ui-flow-contract.txt
          if-no-files-found: ignore
          retention-days: 7
