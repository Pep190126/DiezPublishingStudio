name: UI Contract Diagnostic

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj
      - run: dotnet build src/Diez.Desktop/Diez.Desktop.csproj -c Release --no-restore
      - run: dotnet publish src/Diez.Desktop/Diez.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      # Primary physical-layout gate for this Windows desktop app. It uses the same classic lifetime and
      # production module order as the installed application and therefore runs before the synthetic
      # headless backend, whose font service can fail independently of Win32 layout.
      - name: Run classic Windows UI flow contract
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $resultFile = "artifacts\publish\ui-flow-contract.txt"
          if (Test-Path $resultFile) { Remove-Item $resultFile -Force }
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-flow-contract" -PassThru
          $completed = $process.WaitForExit(60000)
          if (-not $completed) {
            Write-Host "Classic desktop flow timed out after 60 seconds."
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $resultFile) { Get-Content $resultFile }
            throw "Classic Windows UI flow timed out."
          }
          $process.WaitForExit()
          Write-Host "Classic desktop flow exit code: $($process.ExitCode)"
          if (Test-Path $resultFile) {
            Write-Host "--- classic ui-flow-contract.txt ---"
            Get-Content $resultFile
            Copy-Item $resultFile "artifacts\publish\ui-classic-flow-contract.txt" -Force
          }
          $logDir = Join-Path $env:LOCALAPPDATA "Diez Publishing Studio\logs"
          $safeTrace = Join-Path $logDir "safe-startup-trace.log"
          if (Test-Path $safeTrace) {
            Write-Host "--- safe-startup-trace.log ---"
            Get-Content $safeTrace
            Copy-Item $safeTrace "artifacts\publish\ui-classic-safe-startup-trace.log" -Force
          }
          if ($process.ExitCode -ne 0) {
            throw "Classic Windows UI flow failed with exit code $($process.ExitCode)"
          }

      # Secondary structural diagnostic. Keep it separate and non-authoritative for classic Win32 pixels:
      # Avalonia Headless can intermittently fail its synthetic SystemFonts service. A short timeout keeps
      # that infrastructure issue from hiding or delaying the primary classic result.
      - name: Run headless UI tree diagnostic
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $resultFile = "artifacts\publish\ui-flow-contract.txt"
          if (Test-Path $resultFile) { Remove-Item $resultFile -Force }
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-headless-ci --ui-flow-contract" -PassThru
          $completed = $process.WaitForExit(30000)
          if (-not $completed) {
            Write-Host "Headless UI diagnostic timed out after 30 seconds."
            if (Test-Path $resultFile) { Get-Content $resultFile }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          } else {
            $process.WaitForExit()
            Write-Host "Headless UI-tree exit code: $($process.ExitCode)"
            if ($process.ExitCode -ne 0 -and (Test-Path $resultFile)) { Get-Content $resultFile }
          }
          if (Test-Path $resultFile) {
            Copy-Item $resultFile "artifacts\publish\ui-headless-flow-contract.txt" -Force
          }

      - name: Upload UI flow diagnostic when produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diez-UI-Flow-Diagnostic
          path: |
            artifacts/publish/ui-flow-contract.txt
            artifacts/publish/ui-headless-flow-contract.txt
            artifacts/publish/ui-classic-flow-contract.txt
            artifacts/publish/ui-classic-safe-startup-trace.log
            artifacts/publish/ui-headless-startup-error.txt
          if-no-files-found: ignore
          retention-days: 7
