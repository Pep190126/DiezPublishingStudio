name: UI Contract Diagnostic

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj
      - run: dotnet build src/Diez.Desktop/Diez.Desktop.csproj -c Release --no-restore
      - run: dotnet publish src/Diez.Desktop/Diez.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      # Hard deterministic gate: construct/show the real MainWindow, attach the real Diez modules and
      # execute the complete UI contract using Avalonia's supported headless session. Never wait forever:
      # the harness writes START/OK breadcrumbs per sub-contract so a timeout still identifies the hang.
      - name: Run deterministic Windows UI flow contract
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $resultFile = "artifacts\publish\ui-flow-contract.txt"
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-headless-ci --ui-flow-contract" -PassThru
          $completed = $process.WaitForExit(180000)
          if (-not $completed) {
            Write-Host "UI flow contract timed out after 180 seconds."
            if (Test-Path $resultFile) {
              Write-Host "--- partial ui-flow-contract.txt ---"
              Get-Content $resultFile
            }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Deterministic UI flow timed out; inspect the last START breadcrumb above."
          }
          $process.WaitForExit()
          Write-Host "Headless real-UI-tree exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            if (Test-Path $resultFile) { Get-Content $resultFile }
            throw "Deterministic UI flow failed with exit code $($process.ExitCode)"
          }

      # GitHub-hosted Windows runners are non-interactive and may reject Dispatcher.MainLoop even when
      # the installed app is healthy. Keep this probe for startup logs, but do not misclassify the runner's
      # PlatformNotSupportedException as an application regression.
      - name: Probe classic desktop lifetime for diagnostics
        continue-on-error: true
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-flow-contract" -PassThru
          $completed = $process.WaitForExit(60000)
          if (-not $completed) {
            Write-Host "Classic desktop diagnostic timed out after 60 seconds."
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          } else {
            $process.WaitForExit()
            Write-Host "Classic desktop diagnostic exit code: $($process.ExitCode)"
          }
          $resultFile = "artifacts\publish\ui-flow-contract.txt"
          if (Test-Path $resultFile) { Get-Content $resultFile }
          $fatal = Join-Path $env:LOCALAPPDATA "Diez Publishing Studio\logs\fatal-errors.log"
          $startup = Join-Path $env:LOCALAPPDATA "Diez Publishing Studio\logs\startup-errors.log"
          if (Test-Path $fatal) { Write-Host "--- fatal-errors.log ---"; Get-Content $fatal }
          if (Test-Path $startup) { Write-Host "--- startup-errors.log ---"; Get-Content $startup }
          if ($completed -and $process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Upload UI flow diagnostic when produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diez-UI-Flow-Diagnostic
          path: |
            artifacts/publish/ui-flow-contract.txt
            artifacts/publish/ui-headless-startup-error.txt
          if-no-files-found: ignore
          retention-days: 7
