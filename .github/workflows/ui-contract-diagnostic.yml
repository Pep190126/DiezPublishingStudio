name: UI Contract Diagnostic

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj
      - run: dotnet build src/Diez.Desktop/Diez.Desktop.csproj -c Release --no-restore
      - run: dotnet publish src/Diez.Desktop/Diez.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      # Historical async probe bundle. It remains useful for diagnostics but is not a release gate:
      # Avalonia HeadlessUnitTestSession can fail during ResetForUnitTests after async probes even
      # when the deterministic core/apphost/Scene gates pass. New UI contracts should use the
      # synchronous deterministic pattern used by Structured Scene Contract.
      - name: Run legacy UI flow diagnostic
        continue-on-error: true
        run: dotnet artifacts/publish/DiezPublishingStudio.dll --ui-headless-ci --ui-flow-contract

      - name: Upload UI flow diagnostic when produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diez-UI-Flow-Diagnostic
          path: artifacts/publish/ui-flow-contract.txt
          if-no-files-found: ignore
          retention-days: 7
