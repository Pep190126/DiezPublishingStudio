name: Core Apphost Regression

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj
      - run: dotnet build src/Diez.Desktop/Diez.Desktop.csproj -c Release --no-restore
      - run: dotnet publish src/Diez.Desktop/Diez.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      - name: Core self-test through Windows apphost
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Write-Host "Windows apphost self-test exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            $errorFile = "artifacts\publish\self-test-error.txt"
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw "Core self-test failed with exit code $($process.ExitCode)"
          }

      - name: Upload self-test diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diez-Core-SelfTest-Diagnostic
          path: artifacts/publish/self-test-error.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Headless UI startup through Windows apphost
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-headless-ci" -Wait -PassThru
          Write-Host "Windows apphost headless startup exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Headless startup failed with exit code $($process.ExitCode)" }

      # Full historical UI flow is covered by UI Contract Diagnostic.
      # Structured Scene behavior is covered by Structured Scene Contract.
