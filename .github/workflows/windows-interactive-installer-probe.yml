name: Windows Interactive Installer Probe

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  interactive-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore desktop
        run: dotnet restore src/Diez.Desktop/Diez.Desktop.csproj

      - name: Publish self-contained Windows x64
        run: dotnet publish src/Diez.Desktop/Diez.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      - name: Build portable ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/portable | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/portable/DiezPublishingStudio-Portable-win-x64.zip -CompressionLevel Optimal
          if (!(Test-Path artifacts/portable/DiezPublishingStudio-Portable-win-x64.zip)) { throw "Portable ZIP missing" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build conservative setup EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DiezPublishingStudio.iss
          if (!(Test-Path artifacts/installer/DiezPublishingStudio-Setup.exe)) { throw "Installer missing" }

      - name: Probe interactive setup bootstrap
        shell: powershell
        run: |
          $setup = (Resolve-Path "artifacts\installer\DiezPublishingStudio-Setup.exe").Path
          $log = Join-Path $env:RUNNER_TEMP "diez-interactive-setup.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/SP-", "/LOG=`"$log`"" -PassThru
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.HasExited) {
            if (Test-Path $log) { Get-Content $log }
            throw "Interactive installer exited before the wizard could remain available; code=$($p.ExitCode)"
          }
          Write-Host "Interactive setup process alive after 4s; pid=$($p.Id); title=$($p.MainWindowTitle)"
          Stop-Process -Id $p.Id -Force

      - name: Smoke portable apphost
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--ui-headless-ci" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Portable apphost failed with code $($p.ExitCode)" }

      - name: Probe real owned Home file dialog
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts\publish\DiezPublishingStudio.exe").Path
          $errorFile = "artifacts\publish\home-file-dialog-probe-error.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--home-file-dialog-probe" -PassThru
          if (-not $p.WaitForExit(15000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Owned Home file dialog probe timed out"
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw "Owned Home file dialog probe failed with code $($p.ExitCode)"
          }

      - name: Upload conservative installer
        uses: actions/upload-artifact@v4
        with:
          name: DiezPublishingStudio-Setup-Conservative-Interactive
          path: artifacts/installer/DiezPublishingStudio-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DiezPublishingStudio-Portable-win-x64
          path: artifacts/portable/DiezPublishingStudio-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 30
