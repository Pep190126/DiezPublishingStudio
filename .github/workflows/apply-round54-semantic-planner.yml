name: Apply Round 5.4 Semantic Planner

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - 'src/Diez.Uno/Round54ApplyMarker.cs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/uno-platform-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Round 5.4 compile and semantic cleanup
        run: python scripts/apply_round54_compile_semantic_fix.py
      - name: Commit Round 5.4 cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Diez.Core/MultiSubjectProfileService.cs \
            src/Diez.Core/DiezVisualHardPromptFrontendBridge.cs \
            src/Diez.Uno/VisualBookWorkspace.cs
          if git diff --cached --quiet; then
            echo 'No Round 5.4 cleanup changes to commit.'
          else
            git commit -m 'Round 5.4: fix Custom UI scope and canonical consistency labels'
            git push origin HEAD:spike/uno-platform-ui
          fi
