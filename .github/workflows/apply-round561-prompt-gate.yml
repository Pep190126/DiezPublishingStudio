name: Apply Round 5.6.1 Prompt Gate

on:
  push:
    branches:
      - spike/uno-platform-ui
    paths:
      - 'docs/builds/ROUND561_APPLY_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/uno-platform-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Round 5.6.1 prompt gate fix
        run: python scripts/apply_round561_prompt_gate_fix.py
      - name: Commit source and regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Diez.Core/DiezVisualThemeFrontendBridge.cs \
            src/Diez.Uno/VisualBookWorkspace.cs \
            tests/Diez.VisualSemanticRegression/Round561PromptGateRegression.cs
          if git diff --cached --quiet; then
            echo 'No Round 5.6.1 source changes to commit.'
          else
            git commit -m 'Round 5.6.1: gate Prompt on resolved subject plan'
            git push origin HEAD:spike/uno-platform-ui
          fi
